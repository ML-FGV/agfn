[project]
name = "AGFN"
version = "0.1.0"
description = "AGFN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dspy>=2.6.27",
    "ipykernel>=6.29.5",
    "jax>=0.8.2",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "rpy2>=3.5.17",
    "scipy>=1.15.2",
    "setuptools>=79.0.1",
    "torch>=2.7.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"
